<article class="recipe-card">
  <img [src]="recipe().imgUrl" [alt]="recipe().name" class="recipe-image" />

  <div class="recipe-content">
    <h2 class="recipe-name">{{ recipe().name }}</h2>
    <p class="recipe-description">{{ recipe().description }}</p>

    <div class="servings-section">
      <span class="servings-label">Porções:</span>
      <div class="servings-controls">
        <button type="button" class="btn" (click)="decrementServings()">-</button>
        <span class="servings-value">{{ servings() }}</span>
        <button type="button" class="btn" (click)="incrementServings()">+</button>
      </div>
    </div>

    <div class="ingredients-section">
      <h3 class="ingredients-title">Ingredientes Ajustados:</h3>
      <ul class="ingredients-list">
        @for (ingredient of adjustedIngredients(); track ingredient.name) {
          <li>
            <span>{{ ingredient.name }}</span>
            <strong>{{ ingredient.quantity }} {{ ingredient.unit }}</strong>
          </li>
        }
      </ul>
    </div>
  </div>
</article>
